
name: Build Gumula APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Gumula project
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          test -n "$ZIP_FILE"
          mkdir -p buildsrc
          unzip -q "$ZIP_FILE" -d buildsrc
          PROJECT_DIR=$(find buildsrc -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Force Java/Kotlin JVM target to 17
        shell: bash
        run: |
          APP="$PROJECT_DIR/app/build.gradle.kts"
          test -f "$APP"

          python3 - "$APP" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()

          compile_block = ''' compileOptions { sourceCompatibility = JavaVersion.VERSION_17 targetCompatibility = JavaVersion.VERSION_17 } kotlinOptions { jvmTarget = "17" } '''

          if "sourceCompatibility = JavaVersion.VERSION_17" not in s:
              # Insert inside the android { } block, immediately before its final brace.
              depth = 0
              start = s.find("android {")
              if start < 0:
                  raise SystemExit("android { block not found")
              insert_at = None
              for i in range(start, len(s)):
                  if s[i] == "{":
                      depth += 1
                  elif s[i] == "}":
                      depth -= 1
                      if depth == 0:
                          insert_at = i
                          break
              if insert_at is None:
                  raise SystemExit("android { block end not found")
              s = s[:insert_at] + compile_block + "\n" + s[insert_at:]

          open(p, "w", encoding="utf-8").write(s)
          PY

          echo "Patched app/build.gradle.kts:"
          cat "$APP"

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gumula-debug-apk
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
